name: Deploy MK97 Creative Studio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JSON & JavaScript Syntax
        run: |
          node -e "
            const fs = require('fs');
            // Check critical JSON files
            ['templates.json', 'build.json'].forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, 'utf8'));
                console.log('✓ Validated ' + f);
              }
            });
          "
          # Syntax check JS files
          node -c app.js
          node -c poster-editor.js
          node -c video-editor.js
          node -c templates-data.js
          echo "All script and data files passed syntax verification!"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
