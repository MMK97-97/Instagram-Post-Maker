<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05080c">
  <title>Brand Kit — MK97 Creative Studio</title>
  <link rel="stylesheet" href="studio.css?v=20">
</head>
<body data-nav="more">
  <div class="page">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brandmark"><img src="assets/MK97.png" alt="MK97"></span><span><b>MK97</b><small>CREATIVE STUDIO</small></span></a>
      <div class="top-title">Brand Kit<small>LOGOS • COLORS • FONTS</small></div>
      <div class="top-tools"><a class="icon-btn" href="poster-editor.html">✎</a></div>
    </header>

    <main class="main">
      <div id="brandForm" class="detail-layout">
        <section class="stack">
          <div class="panel">
            <div class="eyebrow">BRAND IDENTITY</div>
            <h2 style="margin:8px 0 0;font-size:32px;letter-spacing:-.04em">Manage your brand kit</h2>

            <div class="field"><label>BRAND NAME</label><input id="brandName" value="MK97"></div>
            <div class="field"><label>ACCENT COLOR</label><input id="brandColor" type="color" value="#f3c95b" style="height:52px;padding:6px"></div>
            <label class="field"><span><input id="brandLogoToggle" type="checkbox" checked> Show official logo</span></label>

            <div class="hero-actions" style="margin-top:16px">
              <button id="saveBrand" class="gold-btn" type="button">Save Brand Kit</button>
              <a class="ghost-btn" href="poster-editor.html">Open Poster Studio</a>
            </div>
          </div>

          <div class="grid-4">
            <div class="spec"><b>#D4AF37</b><small>Primary gold</small></div>
            <div class="spec"><b>#0B0B0B</b><small>Dark base</small></div>
            <div class="spec"><b>#1F1F1F</b><small>Secondary</small></div>
            <div class="spec"><b>#FFFFFF</b><small>Accent light</small></div>
          </div>
        </section>

        <aside class="stack">
          <div class="info-card">
            <h3>Brand preview</h3>
            <div style="padding:18px;border:1px solid var(--line);border-radius:20px;background:#070b0f;text-align:center">
              <img src="assets/MK97.png" alt="MK97" style="width:min(80%,260px);filter:drop-shadow(0 0 20px rgba(243,201,91,.14))">
            </div>
          </div>
          <div class="info-card">
            <h3>Brand presets</h3>
            <div class="layer-list">
              <div class="layer"><span>•</span><div class="preview">A</div><div><b>Default Gold</b><small>Primary MK97 treatment</small></div><button>✓</button></div>
              <div class="layer"><span>•</span><div class="preview">B</div><div><b>Monochrome</b><small>Neutral dark / light version</small></div><button>○</button></div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <div data-bottomnav></div>
  </div>
  <script src="studio-data.js?v=20"></script>
  <script src="studio.js?v=20"></script>
</body>
</html>
